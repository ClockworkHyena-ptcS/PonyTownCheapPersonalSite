<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Админ-панель</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: #5f5362;

    background:
        linear-gradient(
            120deg,
            #ffdbea,
            #dff6ff,
            #eadfff,
            #ffe0ee,
            #d8f5ff
        );

    background-size: 500% 500%;

    animation: bg 18s ease infinite;

}

@keyframes bg {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =========================
   ЭКРАН ВХОДА
========================= */

#loginScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #ffdbea,
            #dff6ff,
            #eadfff
        );

    z-index: 99999;

}


.loginBox {

    width: min(420px, 100%);

    padding: 35px;

    text-align: center;

    background:
        rgba(255,255,255,.75);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius: 30px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 20px 60px
        rgba(150,120,160,.2);

}


.loginBox h1 {

    margin-top: 0;

    color: #d17fa2;

}


.loginBox p {

    color: #8f8192;

}


#password {

    width: 100%;

    padding: 15px;

    border: 1px solid #ead6e2;

    border-radius: 16px;

    outline: none;

    font-size: 16px;

    margin-top: 10px;

}


#loginButton {

    width: 100%;

    margin-top: 15px;

    padding: 14px;

    border: 0;

    border-radius: 17px;

    background: #d17fa2;

    color: white;

    font-size: 16px;

    cursor: pointer;

}


#loginButton:hover {

    opacity: .85;

}


#error {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 14px;

    background: #ffe0e0;

    color: #b33d4d;

}


/* =========================
   АДМИНКА
========================= */

#adminPanel {

    display: none;

}


.container {

    width: min(1000px, 94%);

    margin: auto;

    padding: 25px 0 50px;

}


header {

    padding: 30px;

    text-align: center;

    background:
        rgba(255,255,255,.65);

    border-radius: 30px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 10px 35px
        rgba(160,120,160,.15);

}


header h1 {

    color: #d17fa2;

}


.panel {

    margin-top: 20px;

    padding: 25px;

    background:
        rgba(255,255,255,.65);

    border-radius: 30px;

    backdrop-filter: blur(15px);

}


h2 {

    color: #d17fa2;

}


label {

    display: block;

    margin-top: 18px;

    margin-bottom: 7px;

    font-weight: bold;

}


input,
textarea {

    width: 100%;

    padding: 13px;

    border: 1px solid #ead6e2;

    border-radius: 15px;

    outline: none;

    font-family: Arial, sans-serif;

}


textarea {

    min-height: 130px;

    resize: vertical;

}


.cardEditor {

    padding: 20px;

    margin-top: 20px;

    background:
        rgba(255,255,255,.55);

    border-radius: 22px;

}


button {

    border: 0;

    border-radius: 17px;

    padding: 13px 20px;

    cursor: pointer;

}


.logout {

    background: #d65362;

    color: white;

    margin-top: 20px;

}


.back {

    background: white;

    color: #876b7d;

    margin-top: 20px;

}


.status {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 15px;

    background: #dff7e5;

    color: #347344;

}


@media(max-width:600px) {

    .container {

        width: 94%;

    }

    .panel {

        padding: 20px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ВХОД
========================= -->

    <div class="loginBox">

        <h1>🔐 Админ-панель</h1>

        <p>
            @cheapponytownskins
        </p>

        <input
            id="password"
            type="password"
            placeholder="Введите пароль"
            autocomplete="off"
        >

        <button
            id="loginButton">

            Войти

        </button>

        <div id="error">
            Неверный пароль
        </div>

    </div>

</div>



<!-- =========================
     ПАНЕЛЬ
========================= -->

<div id="adminPanel">

<div class="container">


<header>

<h1>
⚙️ Управление сайтом
</h1>

<p>
@cheapponytownskins
</p>

</header>



<div class="panel">


<h2>

</h2>


<label>

</label>

<input

>

</label>

<textarea

Здесь будут собраны полезная информация, новости, правила, инструкции и другие материалы нашего канала.

<h2>
📖 Карточки
</h2>



<div class="cardEditor">

<h3>

<input
    id="rulesTitle"

<label>

<input

<label>

</label>

<textarea

<div class="cardEditor">

<h3>
📰 Новости
</h3>

<label>
Название
</label>

<input
    id="newsTitle"
    value="Новости"
>

<label>

</label>

<input
    id="newsDescription"
    value="Новости и важные объявления."
>

<label>
Полный текст
</label>

<textarea
    id="newsText">Здесь будут новости и объявления.</textarea>

<div class="cardEditor">

<h3>
🤖 Боты
</h3>

<label>
Название
</label>

<input
    id="botsTitle"
    value="Боты"

<label>

</label>

<input
    id="botsDescription"
    value="Полезные боты и инструкции."
>

<label>
Полный текст
</label>

<textarea
    id="botsText">Здесь будут инструкции по ботам.</textarea>

<div class="cardEditor">

<h3>
🎨 Скины
</h3>

<label>
Название
</label>

<input
    id="skinsTitle"
    value="Скины"

</label>

<input
    id="skinsDescription"
    value="Информация о скинах."
>

<label>
Полный текст
</label>

<textarea
    id="skinsText">Здесь можно разместить информацию о скинах.</textarea>

</div>



<h2>
👥 Администрация
</h2>



<div class="cardEditor">

<h3>
Администратор №1
</h3>

<label>
Имя
</label>

<input
    id="admin1Name"
    value="Имя администратора"
>

<label>
Должность
</label>

<input
    id="admin1Position"
    value="Владелец"
>

<label>
Описание
</label>

<textarea
    id="admin1Text">Информация об администраторе.</textarea>

</div>



<div class="cardEditor">

<h3>
Администратор №2
</h3>

<label>
Имя
</label>

<input
    id="admin2Name"
    value="Имя администратора"
>

<label>
Должность
</label>

<input
    id="admin2Position"
    value="Администратор"
>

<label>
Описание
</label>

<textarea
    id="admin2Text">Информация об администраторе.</textarea>

</div>



<button
    class="back"
    onclick="window.location.href='index.html'">

← На сайт

</button>


<button
    class="logout"
    onclick="logout()">

🚪 Выйти

</button>


<div
    id="status"
    class="status">

Вы вошли в админ-панель.

</div>


</div>

</div>

</div>



<script>

/*
=========================================
АДРЕС БЕЗ СЛЭША В КОНЦЕ
=========================================
*/

const WORKER_URL =
    "https://cheapponytown-admin.chupacapra228.workers.dev";


/*
=========================================
ЭЛЕМЕНТЫ
=========================================
*/

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const adminPanel =
    document.getElementById(
        "adminPanel"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const errorBox =
    document.getElementById(
        "error"
    );


/*
=========================================
ПРОВЕРКА ПАРОЛЯ
=========================================
*/

async function login() {

    const password =
        passwordInput.value;


    if (!password) {

        errorBox.textContent =
            "Введите пароль.";

        errorBox.style.display =
            "block";

        return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
        "Проверка...";

    errorBox.style.display =
        "none";


    try {

        const response =
            await fetch(
                WORKER_URL +
                "/api/login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        password: password
                    })

                }
            );


        const result =
            await response.json();


        if (
            response.ok &&
            result.success
        ) {

            loginScreen.style.display =
                "none";

            adminPanel.style.display =
                "block";

        } else {

            errorBox.textContent =
                result.message ||
                "Неверный пароль.";

            errorBox.style.display =
                "block";

        }


    } catch (error) {

        errorBox.textContent =
            "Не удалось подключиться к серверу.";

        errorBox.style.display =
            "block";

    }


    loginButton.disabled =
        false;

    loginButton.textContent =
        "Войти";

}


/*
=========================================
КНОПКА ВХОДА
=========================================
*/

loginButton.addEventListener(
    "click",
    login
);


/*
=========================================
ENTER
=========================================
*/

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


/*
=========================================
ВЫХОД
=========================================
*/

function logout() {

    adminPanel.style.display =
        "none";

    loginScreen.style.display =
        "flex";

    passwordInput.value =
        "";

    errorBox.style.display =
        "none";

}


/*
=========================================
ЗАЩИТА ОТ ПРОСТОГО ОБХОДА
=========================================
*/

adminPanel.style.display =
    "none";

loginScreen.style.display =
    "flex";

</script>


</body>

    </html>
