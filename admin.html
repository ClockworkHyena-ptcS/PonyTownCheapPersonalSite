<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Редактор</title>

<link
    rel="stylesheet"
    href="style.css">

<style>

.editor {

    width: min(900px,94%);

    margin: auto;

    padding: 25px 0 60px;
}

.editor-box {

    margin-top: 20px;

    padding: 25px;

    background: var(--glass);

    border:
        1px solid var(--border);

    border-radius: 25px;

    backdrop-filter: blur(15px);
}

.editor-box h2 {

    color: var(--primary);
}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 6px;

    color: var(--text);

    font-weight: bold;
}

input,
textarea {

    width: 100%;

    padding: 13px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    background: var(--card);

    color: var(--text);

    outline: none;

    font-family: Arial;
}

textarea {

    min-height: 140px;

    resize: vertical;
}

.action {

    margin-top: 20px;

    padding: 14px 20px;

    border: 0;

    border-radius: 16px;

    cursor: pointer;

    background: var(--primary);

    color: white;
}

.back {

    background: var(--card);

    color: var(--text);

}

</style>

</head>

<body>


<button
    id="themeButton"
    type="button">

🌙

</button>


<div class="editor">


<header>

<h1>
Редактор сайта
</h1>

<p>
@cheapponytownskins
</p>

</header>



<div class="editor-box">

<h2>
🏠 Главное
</h2>


<label>
Название
</label>

<input
    id="siteName">


<label>
Подзаголовок
</label>

<input
    id="subtitle">


<label>
Главный текст
</label>

<textarea
    id="welcome">
</textarea>

</div>



<div class="editor-box">

<h2>
♡ Владелец
</h2>


<label>
Заголовок
</label>

<input
    id="ownerTitle">


<label>
Имя
</label>

<input
    id="ownerName">


<label>
Информация
</label>

<textarea
    id="ownerText">
</textarea>

</div>



<div class="editor-box">

<h2>
📜 Правила
</h2>

<label>
Название
</label>

<input
    id="rulesTitle">

<label>
Описание
</label>

<input
    id="rulesDescription">

<label>
Полный текст
</label>

<textarea
    id="rulesText">
</textarea>

</div>



<div class="editor-box">

<h2>
📰 Новости
</h2>

<label>
Название
</label>

<input
    id="newsTitle">

<label>
Описание
</label>

<input
    id="newsDescription">

<label>
Полный текст
</label>

<textarea
    id="newsText">
</textarea>

</div>



<div class="editor-box">

<h2>
🤖 Боты
</h2>

<label>
Название
</label>

<input
    id="botsTitle">

<label>
Описание
</label>

<input
    id="botsDescription">

<label>
Полный текст
</label>

<textarea
    id="botsText">
</textarea>

</div>



<div class="editor-box">

<h2>
🎨 Скины
</h2>

<label>
Название
</label>

<input
    id="skinsTitle">

<label>
Описание
</label>

<input
    id="skinsDescription">

<label>
Полный текст
</label>

<textarea
    id="skinsText">
</textarea>

</div>



<div class="editor-box">

<h2>
👥 Администраторы
</h2>


<label>
Администратор 1
</label>

<input
    id="admin1Name">

<label>
Должность
</label>

<input
    id="admin1Position">

<label>
Описание
</label>

<textarea
    id="admin1Description">
</textarea>


<label>
Администратор 2
</label>

<input
    id="admin2Name">

<label>
Должность
</label>

<input
    id="admin2Position">

<label>
Описание
</label>

<div class="editor-box">

<h2>
💾 Сохранение
</h2>

<p>
Изменения сохраняются в браузере.
</p>

<button
    class="action"
    id="save">

💾 Сохранить

</button>

<button
    class="action back"
    onclick="location.href='index.html'">

← Вернуться на сайт

</button>

</div>


</div>


<script src="data.js"></script>


<script>

/* Заполняем поля */

siteName.value =
    SITE_DATA.siteName;

subtitle.value =
    SITE_DATA.subtitle;

welcome.value =
    SITE_DATA.welcome;

ownerTitle.value =
    SITE_DATA.owner.title;

ownerName.value =
    SITE_DATA.owner.name;

ownerText.value =
    SITE_DATA.owner.text;



const rules =
    SITE_DATA.cards.find(
        x => x.id === "rules"
    );

const news =
    SITE_DATA.cards.find(
        x => x.id === "news"
    );

const bots =
    SITE_DATA.cards.find(
        x => x.id === "bots"
    );

const skins =
    SITE_DATA.cards.find(
        x => x.id === "skins"
    );



rulesTitle.value =
    rules.title;

rulesDescription.value =
    rules.description;

rulesText.value =
    rules.text;



newsTitle.value =
    news.title;

newsDescription.value =
    news.description;

newsText.value =
    news.text;



botsTitle.value =
    bots.title;

botsDescription.value =
    bots.description;

botsText.value =
    bots.text;



skinsTitle.value =
    skins.title;

skinsDescription.value =
    skins.description;

skinsText.value =
    skins.text;



admin1Name.value =
    SITE_DATA.admins[0].name;

admin1Position.value =
    SITE_DATA.admins[0].position;

admin1Description.value =
    SITE_DATA.admins[0].description;



admin2Name.value =
    SITE_DATA.admins[1].name;

admin2Position.value =
    SITE_DATA.admins[1].position;

admin2Description.value =
    SITE_DATA.admins[1].description;



/*
=================================
СОХРАНЕНИЕ
=================================
*/

document.getElementById(
    "save"
).onclick = function() {

    const updated = {

        siteName:
            siteName.value,

        subtitle:
            subtitle.value,

        welcome:
            welcome.value,

        owner: {

            title:
                ownerTitle.value,

            name:
                ownerName.value,

            text:
                ownerText.value

        },

        cards: [

            {
                id: "rules",
                icon: "📜",
                title:
                    rulesTitle.value,
                description:
                    rulesDescription.value,
                text:
                    rulesText.value
            },

            {
                id: "news",
                icon: "📰",
                title:
                    newsTitle.value,
                description:
                    newsDescription.value,
                text:
                    newsText.value
            },

            {
                id: "bots",
                icon: "🤖",
                title:
                    botsTitle.value,
                description:
                    botsDescription.value,
                text:
                    botsText.value
            },

            {
                id: "skins",
                icon: "🎨",
                title:
                    skinsTitle.value,
                description:
                    skinsDescription.value,
                text:
                    skinsText.value
            }

        ],

        admins: [

            {
                name:
                    admin1Name.value,

                position:
                    admin1Position.value,

                description:
                    admin1Description.value
            },

            {
                name:
                    admin2Name.value,

                position:
                    admin2Position.value,

                description:
                    admin2Description.value
            }

        ],

        footer:
            SITE_DATA.footer

    };


    localStorage.setItem(
        "siteData",
        JSON.stringify(updated)
    );


    alert(
        "Изменения сохранены в этом браузере!"
    );

};



/* ТЕМА */

const themeButton =
    document.getElementById(
        "themeButton"
    );


function applyTheme() {

    const theme =
        localStorage.getItem(
            "siteTheme"
        );

    if (
        theme === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀️";

    } else {

        document.body.classList.remove(
            "dark"
        );

        themeButton.textContent =
            "🌙";

    }

}


themeButton.onclick =
    function() {

        const dark =
            document.body.classList.contains(
                "dark"
            );

        localStorage.setItem(
            "siteTheme",
            dark
                ? "light"
                : "dark"
        );

        applyTheme();

    };


applyTheme();

</script>

</body>

</html>
