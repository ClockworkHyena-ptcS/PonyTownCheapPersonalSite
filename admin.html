<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админ-панель</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: #5f5362;

    background:
        linear-gradient(
            120deg,
            #ffdbea,
            #dff6ff,
            #eadfff,
            #ffe0ee,
            #d8f5ff
        );

    background-size: 500% 500%;

    animation:
        bg 18s ease infinite;

    padding: 25px;
}


@keyframes bg {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


.container {

    width: min(900px, 100%);

    margin: auto;
}


header {

    padding: 30px;

    text-align: center;

    background:
        rgba(255,255,255,.65);

    border:
        1px solid rgba(255,255,255,.8);

    border-radius: 30px;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 10px 35px rgba(160,120,160,.15);

    margin-bottom: 20px;
}


h1 {

    margin: 0;

    color: #d17fa2;
}


.subtitle {

    margin-top: 8px;

    color: #8f8192;
}


.panel {

    padding: 25px;

    margin-bottom: 20px;

    background:
        rgba(255,255,255,.65);

    border:
        1px solid rgba(255,255,255,.8);

    border-radius: 25px;

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 10px 35px rgba(160,120,160,.13);
}


.panel h2 {

    margin-top: 0;

    color: #d17fa2;
}


label {

    display: block;

    margin-top: 15px;

    margin-bottom: 6px;

    font-weight: bold;
}


input,
textarea {

    width: 100%;

    border: none;

    outline: none;

    padding: 13px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.8);

    color: #5f5362;

    font-family: Arial, sans-serif;

    font-size: 15px;
}


textarea {

    min-height: 120px;

    resize: vertical;
}


button {

    border: none;

    padding: 13px 20px;

    margin-top: 15px;

    border-radius: 18px;

    cursor: pointer;

    background: #d98aad;

    color: white;

    font-size: 15px;

    transition: .25s;
}


button:hover {

    transform:
        translateY(-2px);

    background: #c96f96;
}


.danger {

    background: #c94d5c;
}


.danger:hover {

    background: #b43e4d;
}


.success {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 15px;

    background: rgba(150,220,170,.5);

    color: #386b45;
}


.admin-card {

    padding: 20px;

    margin-top: 15px;

    background:
        rgba(255,255,255,.55);

    border-radius: 20px;
}


hr {

    border: none;

    height: 1px;

    background: rgba(150,120,150,.2);

    margin: 25px 0;
}


.back {

    display: inline-block;

    margin-top: 10px;

    color: #d17fa2;

    text-decoration: none;

    font-weight: bold;
}


@media(max-width:600px) {

    body {
        padding: 12px;
    }

    header,
    .panel {
        padding: 20px;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

<h1>
⚙️ Админ-панель
</h1>

<div class="subtitle">
Управление сайтом @cheapponytownskins
</div>

<a
    class="back"
    href="index.html">

    ← Вернуться на сайт

</a>

</header>



<!-- ===== ОСНОВНАЯ ИНФОРМАЦИЯ ===== -->

<div class="panel">

<h2>
🏠 Главное
</h2>


<label>
Название сайта
</label>

<input
    id="siteName"
    type="text"
    placeholder="@cheapponytownskins">


<label>
Подзаголовок
</label>

<input
    id="subtitle"
    type="text"
    placeholder="личное пространство канала ♡">


<label>
Главный текст
</label>

<textarea
    id="welcome">
</textarea>


</div>



<!-- ===== ПРАВИЛА ===== -->

<div class="panel">

<h2>
📜 Правила
</h2>

<label>
Название карточки
</label>

<input
    id="rulesTitle"
    type="text"
    value="📜 Правила">


<label>
Краткое описание
</label>

<input
    id="rulesShort"
    type="text"
    value="Основные правила канала.">


<label>
Полный текст правил
</label>

<textarea
    id="rulesText"
    style="min-height:250px;">
</textarea>

</div>



<!-- ===== НОВОСТИ ===== -->

<div class="panel">

<h2>
📰 Новости
</h2>

<label>
Название
</label>

<input
    id="newsTitle"
    type="text"
    value="📰 Новости">


<label>
Краткое описание
</label>

<input
    id="newsShort"
    type="text"
    value="Новости и важные объявления.">


<label>
Полный текст
</label>

<textarea
    id="newsText">
</textarea>

</div>



<!-- ===== БОТЫ ===== -->

<div class="panel">

<h2>
🤖 Боты
</h2>

<label>
Название
</label>

<input
    id="botsTitle"
    type="text"
    value="🤖 Боты">


<label>
Краткое описание
</label>

<input
    id="botsShort"
    type="text"
    value="Полезные боты и инструкции.">


<label>
Полный текст
</label>

<textarea
    id="botsText">
</textarea>

</div>



<!-- ===== СКИНЫ ===== -->

<div class="panel">

<h2>
🎨 Скины
</h2>

<label>
Название
</label>

<input
    id="skinsTitle"
    type="text"
    value="🎨 Скины">


<label>
Краткое описание
</label>

<input
    id="skinsShort"
    type="text"
    value="Информация о скинах.">


<label>
Полный текст
</label>

<textarea
    id="skinsText">
</textarea>

</div>



<!-- ===== АДМИНИСТРАТОРЫ ===== -->

<div class="panel">

<h2>
👑 Администрация
</h2>


<div class="admin-card">

<h3>
Администратор №1
</h3>


<label>
Имя
</label>

<input
    id="admin1Name"
    type="text"
    value="Имя администратора">


<label>
Должность
</label>

<input
    id="admin1Position"
    type="text"
    value="Владелец">


<label>
Описание
</label>

<textarea
    id="admin1Description"></textarea>

</div>



<div class="admin-card">

<h3>
Администратор №2
</h3>


<label>
Имя
</label>

<input
    id="admin2Name"
    type="text"
    value="Имя администратора">


<label>
Должность
</label>

<input
    id="admin2Position"
    type="text"
    value="Администратор">


<label>
Описание
</label>

<textarea
    id="admin2Description"></textarea>

</div>

</div>



<!-- ===== СОХРАНЕНИЕ ===== -->

<div class="panel">

<h2>
💾 Сохранение
</h2>

<p>
После изменения информации нажми кнопку ниже.
</p>


<button
    onclick="saveData()">

    💾 Сохранить изменения

</button>


<button
    class="danger"
    onclick="resetData()">

    🗑 Сбросить настройки

</button>


<div
    class="success"
    id="success">

    ✅ Изменения сохранены!

</div>

</div>


</div>



<script>


const fields = [

    "siteName",
    "subtitle",
    "welcome",

    "rulesTitle",
    "rulesShort",
    "rulesText",

    "newsTitle",
    "newsShort",
    "newsText",

    "botsTitle",
    "botsShort",
    "botsText",

    "skinsTitle",
    "skinsShort",
    "skinsText",

    "admin1Name",
    "admin1Position",
    "admin1Description",

    "admin2Name",
    "admin2Position",
    "admin2Description"

];



/* ===== ЗАГРУЗКА ===== */

function loadData() {

    fields.forEach(function(id) {

        const saved =
            localStorage.getItem(
                "site_" + id
            );

        if (saved !== null) {

            document.getElementById(id).value =
                saved;

        }

    });

}



/* ===== СОХРАНЕНИЕ ===== */

function saveData() {

    fields.forEach(function(id) {

        const value =
            document.getElementById(id).value;

        localStorage.setItem(
            "site_" + id,
            value
        );

    });


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(function() {

        success.style.display =
            "none";

    }, 2500);

}



/* ===== СБРОС ===== */

function resetData() {

    const answer =
        confirm(
            "Точно удалить все сохранённые настройки?"
        );


    if (!answer) {
        return;
    }


    fields.forEach(function(id) {

        localStorage.removeItem(
            "site_" + id
        );

    });


    location.reload();

}


loadData();

</script>


</body>
    </html>
