<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админ-панель</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(
            120deg,
            #ffdbea,
            #dff6ff,
            #eadfff,
            #ffe0ee
        );

    min-height: 100vh;
    color: #5f5362;
}

.container {
    width: min(1000px, 94%);
    margin: auto;
    padding: 20px 0 50px;
}

header {
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    margin: 0;
    color: #d17fa2;
}

header p {
    color: #8f8192;
}

.panel {
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 25px;
    margin-bottom: 20px;
}

.panel h2 {
    color: #d17fa2;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    border: 1px solid #e2cbd9;
    background: white;
    font-size: 15px;
    color: #5f5362;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));

    gap: 15px;
}

.editor-card {
    background: rgba(255,255,255,.55);
    padding: 18px;
    border-radius: 20px;
}

button {
    border: none;
    padding: 14px 20px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    margin: 5px;
}

.save {
    background: #d98aad;
    color: white;
}

.preview {
    background: #dff3ff;
    color: #557080;
}

.download {
    background: #d9f5df;
    color: #54735c;
}

.reset {
    background: #eee;
    color: #666;
}

#message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 15px;
    background: rgba(255,255,255,.8);
    display: none;
}

.preview-box {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 20px;
}

iframe {
    width: 100%;
    height: 650px;
    border: none;
}

.color {
    height: 50px;
    padding: 3px;
}

</style>
</head>

<body>

<div class="container">

<header>

<h1>⚙️ Админ-панель</h1>

<p>
Редактор сайта @cheapponytownskins
</p>

</header>


<!-- ОСНОВНОЕ -->

<div class="panel">

<h2>🏠 Основное</h2>

<label>Название сайта</label>
<input id="siteName">

<label>Подзаголовок</label>
<input id="subtitle">

<label>Заголовок главного раздела</label>
<input id="homeTitle">

<label>Текст главного раздела</label>
<textarea id="homeText"></textarea>

<label>Текст внизу сайта</label>
<input id="footer">

</div>


<!-- МЕНЮ -->

<div class="panel">

<h2>🧭 Меню</h2>

<div class="grid">

<div>

<label>Кнопка 1</label>
<input id="nav1">

</div>

<div>

<label>Кнопка 2</label>
<input id="nav2">

</div>

<div>

<label>Кнопка 3</label>
<input id="nav3">

</div>

</div>

</div>


<!-- КАРТОЧКИ -->

<div class="panel">

<h2>📖 Записи</h2>

<div class="grid">

<div class="editor-card">

<h3>Карточка 1</h3>

<label>Название</label>
<input id="card1Title">

<label>Описание</label>
<textarea id="card1Text"></textarea>

</div>


<div class="editor-card">

<h3>Карточка 2</h3>

<label>Название</label>
<input id="card2Title">

<label>Описание</label>
<textarea id="card2Text"></textarea>

</div>


<div class="editor-card">

<h3>Карточка 3</h3>

<label>Название</label>
<input id="card3Title">

<label>Описание</label>
<textarea id="card3Text"></textarea>

</div>


<div class="editor-card">

<h3>Карточка 4</h3>

<label>Название</label>
<input id="card4Title">

<label>Описание</label>
<textarea id="card4Text"></textarea>

</div>

</div>

</div>


<!-- АДМИНЫ -->

<div class="panel">

<h2>👥 Администрация</h2>

<div class="grid">

<div class="editor-card">

<h3>Администратор 1</h3>

<label>Имя</label>
<input id="admin1Name">

<label>Должность</label>
<input id="admin1Position">

<label>Описание</label>
<textarea id="admin1Text"></textarea>

</div>


<div class="editor-card">

<h3>Администратор 2</h3>

<label>Имя</label>
<input id="admin2Name">

<label>Должность</label>
<input id="admin2Position">

<label>Описание</label>
<textarea id="admin2Text"></textarea>

</div>

</div>

</div>


<!-- ЦВЕТА -->

<div class="panel">

<h2>🎨 Цвета</h2>

<div class="grid">

<div>

<label>Основной цвет</label>

<input
type="color"
class="color"
id="primaryColor">

</div>


<div>

<label>Цвет текста</label>

<input
type="color"
class="color"
id="textColor">

</div>


<div>

<label>Дополнительный цвет</label>

<input
type="color"
class="color"
id="secondaryColor">

</div>

</div>

</div>


<!-- УПРАВЛЕНИЕ -->

<div class="panel">

<h2>💾 Управление</h2>

<button
class="save"
onclick="saveSettings()">

💾 Сохранить настройки

</button>


<button
class="preview"
onclick="updatePreview()">

👁️ Обновить предпросмотр

</button>


<button
class="download"
onclick="downloadHTML()">

📥 Получить готовый index.html

</button>


<button
class="reset"
onclick="resetSettings()">

↩️ Сбросить

</button>


<div id="message"></div>

</div>


<!-- ПРЕДПРОСМОТР -->

<div class="panel">

<h2>👁️ Предпросмотр</h2>

<div class="preview-box">

<iframe id="preview"></iframe>

</div>

</div>


</div>


<script>


const defaults = {

siteName:
"@cheapponytownskins",

subtitle:
"личное пространство канала ♡",

homeTitle:
"Главное ♡",

homeText:
"Добро пожаловать на официальный сайт @cheapponytownskins!\n\nЗдесь будут собраны полезная информация, новости, правила, инструкции и другие материалы нашего канала.\n\n✦ Создано с любовью ✦",

footer:
"@cheapponytownskins · 2026 ♡",

nav1:
"Главное",

nav2:
"Записи",

nav3:
"Администрация",


card1Title:
"📜 Правила",

card1Text:
"Здесь будут находиться правила канала и другая важная информация.",


card2Title:
"📰 Новости",

card2Text:
"Здесь можно публиковать новости, объявления и обновления.",


card3Title:
"🤖 Боты",

card3Text:
"Здесь будут инструкции по использованию ботов и полезные команды.",


card4Title:
"🎨 Скины",

card4Text:
"Здесь можно разместить инструкции, советы и информацию о скинах.",


admin1Name:
"Имя администратора",

admin1Position:
"Владелец",

admin1Text:
"Здесь можно написать информацию об этом человеке.",


admin2Name:
"Имя администратора",

admin2Position:
"Администратор",

admin2Text:
"Здесь можно написать должность и обязанности.",


primaryColor:
"#d17fa2",

textColor:
"#5f5362",

secondaryColor:
"#8f8192"

};


function getSettings() {

    const saved =
        localStorage.getItem("adminSettings");

    if (!saved) {

        return {
            ...defaults
        };

    }

    return {
        ...defaults,
        ...JSON.parse(saved)
    };

}


function loadSettings() {

    const settings =
        getSettings();

    Object.keys(settings).forEach(key => {

        const element =
            document.getElementById(key);

        if (element) {

            element.value =
                settings[key];

        }

    });

}


function getCurrentSettings() {

    const settings = {};

    Object.keys(defaults).forEach(key => {

        const element =
            document.getElementById(key);

        if (element) {

            settings[key] =
                element.value;

        }

    });

    return settings;

}


function saveSettings() {

    const settings =
        getCurrentSettings();

    localStorage.setItem(
        "adminSettings",
        JSON.stringify(settings)
    );

    updatePreview();

    showMessage(
        "✅ Настройки сохранены!"
    );

}


function resetSettings() {

    if (
        !confirm(
            "Сбросить все изменения?"
        )
    ) {
        return;
    }

    localStorage.removeItem(
        "adminSettings"
    );

    loadSettings();

    updatePreview();

    showMessage(
        "↩️ Настройки сброшены."
    );

}


function showMessage(text) {

    const box =
        document.getElementById("message");

    box.textContent =
        text;

    box.style.display =
        "block";

    setTimeout(() => {

        box.style.display =
            "none";

    }, 3000);

}


function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

}


function generateHTML(settings) {

return `<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>${escapeHTML(settings.siteName)}</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: ${settings.textColor};

    background:

    linear-gradient(
        120deg,
        #ffdbea,
        #dff6ff,
        #eadfff,
        #ffe0ee,
        #d8f5ff
    );

    background-size: 500% 500%;

    animation:
    waterfall 18s ease infinite;

}

@keyframes waterfall {

0% {
    background-position: 0% 50%;
}

50% {
    background-position: 100% 50%;
}

100% {
    background-position: 0% 50%;
}

}

.page {

    width:
    min(1000px, 92%);

    margin: auto;

    padding:
    25px 0 50px;

}

header {

    text-align: center;

    padding: 35px 20px;

    margin-bottom: 20px;

    background:
    rgba(255,255,255,.55);

    border:
    1px solid
    rgba(255,255,255,.8);

    border-radius: 30px;

    box-shadow:
    0 10px 35px
    rgba(160,120,160,.15);

    backdrop-filter:
    blur(15px);

}

.logo {

    font-size: 32px;

    font-weight: bold;

    color:
    ${settings.primaryColor};

    margin-bottom: 8px;

}

.subtitle {

    color:
    ${settings.secondaryColor};

}

nav {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin: 20px 0;

}

nav a {

    text-decoration: none;

    color: #876b7d;

    background:
    rgba(255,255,255,.65);

    padding:
    12px 20px;

    border-radius: 20px;

}

section {

    margin-top: 25px;

    padding: 30px;

    background:
    rgba(255,255,255,.62);

    border-radius: 30px;

    backdrop-filter:
    blur(15px);

}

h2 {

    color:
    ${settings.primaryColor};

}

.welcome {

    text-align: center;

    font-size: 18px;

    line-height: 1.7;

}

.cards {

    display: grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap: 15px;

}

.card {

    padding: 22px;

    background:
    rgba(255,255,255,.7);

    border-radius: 22px;

}

.card h3 {

    color:
    ${settings.primaryColor};

}

.admin {

    text-align: center;

}

.admin-name {

    font-size: 20px;

    font-weight: bold;

    color:
    ${settings.primaryColor};

}

.position {

    color:
    ${settings.secondaryColor};

}

footer {

    text-align: center;

    padding: 30px 10px 0;

    color:
    ${settings.secondaryColor};

    font-size: 13px;

}

</style>

</head>

<body>

<div class="page">

<header>

<div class="logo">
${escapeHTML(settings.siteName)}
</div>

<div class="subtitle">
${escapeHTML(settings.subtitle)}
</div>

</header>


<nav>

<a href="#home">
${escapeHTML(settings.nav1)}
</a>

<a href="#posts">
${escapeHTML(settings.nav2)}
</a>

<a href="#admins">
${escapeHTML(settings.nav3)}
</a>

</nav>


<section id="home">

<h2>
${escapeHTML(settings.homeTitle)}
</h2>

<div class="welcome">

${escapeHTML(settings.homeText)
.replace(/\n/g,"<br>")}

</div>

</section>


<section id="posts">

<h2>
Записи 📖
</h2>

<div class="cards">

<div class="card">

<h3>
${escapeHTML(settings.card1Title)}
</h3>

<p>
${escapeHTML(settings.card1Text)}
</p>

</div>


<div class="card">

<h3>
${escapeHTML(settings.card2Title)}
</h3>

<p>
${escapeHTML(settings.card2Text)}
</p>

</div>


<div class="card">

<h3>
${escapeHTML(settings.card3Title)}
</h3>

<p>
${escapeHTML(settings.card3Text)}
</p>

</div>


<div class="card">

<h3>
${escapeHTML(settings.card4Title)}
</h3>

<p>
${escapeHTML(settings.card4Text)}
</p>

</div>

</div>

</section>


<section id="admins">

<h2>
Администрация ♡
</h2>

<div class="cards">

<div class="card admin">

<div class="admin-name">

${escapeHTML(settings.admin1Name)}

</div>

<div class="position">

${escapeHTML(settings.admin1Position)}

</div>

<p>

${escapeHTML(settings.admin1Text)}

</p>

</div>


<div class="card admin">

<div class="admin-name">

${escapeHTML(settings.admin2Name)}

</div>

<div class="position">

${escapeHTML(settings.admin2Position)}

</div>

<p>

${escapeHTML(settings.admin2Text)}

</p>

</div>

</div>

</section>


<footer>

${escapeHTML(settings.footer)}

</footer>

</div>

</body>

</html>`;

}


function updatePreview() {

    const settings =
        getCurrentSettings();

    const html =
        generateHTML(settings);

    const frame =
        document.getElementById(
            "preview"
        );

    frame.srcdoc =
        html;

}


function downloadHTML() {

    const settings =
        getCurrentSettings();

    const html =
        generateHTML(settings);

    const blob =
        new Blob(
            [html],
            {
                type:
                "text/html"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href =
        url;

    link.download =
        "index.html";

    link.click();

    URL.revokeObjectURL(url);

    showMessage(
        "📥 Готовый index.html создан!"
    );

}


loadSettings();

updatePreview();

</script>

</body>
                                     </html>
