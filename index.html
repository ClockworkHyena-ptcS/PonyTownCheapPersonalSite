<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>@cheapponytownskins</title>

<link
    rel="stylesheet"
    href="style.css">

</head>


<body>


<button
    id="themeButton"
    type="button">

    🌙

</button>



<div class="page">


<header>

<div
    class="logo"
    id="siteName">
</div>

<div
    class="subtitle"
    id="subtitle">
</div>

</header>



<nav>

<a href="#home">
Главное
</a>

<a href="#posts">
Записи
</a>

<a href="#admins">
Администрация
</a>

<a href="admin.html">
⚙️ Админ
</a>

</nav>



<section id="home">

<h2>
Главное ♡
</h2>

<div
    class="welcome"
    id="welcome">
</div>

</section>



<section id="posts">

<h2>
Записи 📖
</h2>

<div
    class="cards"
    id="cards">
</div>

</section>



<section id="admins">

<h2>
Администрация ♡
</h2>

<div
    class="cards"
    id="adminsList">
</div>

</section>



<footer
    id="footer">
</footer>


</div>



<div
    id="popup"
    class="popup">

<div class="popup-window">


<div class="popup-header">

<h3
    id="popupTitle"
    class="popup-title">
</h3>

<button
    id="closePopup"
    class="close">

×
    
</button>

</div>


<div
    id="popupContent"
    class="popup-content">
</div>


</div>

</div>



<script src="data.js"></script>


<script>

const siteName =
    document.getElementById("siteName");

const subtitle =
    document.getElementById("subtitle");

const welcome =
    document.getElementById("welcome");

const cards =
    document.getElementById("cards");

const adminsList =
    document.getElementById("adminsList");

const footer =
    document.getElementById("footer");


siteName.innerHTML =
    SITE_DATA.siteName;

subtitle.innerHTML =
    SITE_DATA.subtitle;

welcome.innerHTML =
    SITE_DATA.welcome;

footer.innerHTML =
    SITE_DATA.footer;



/* КАРТОЧКИ */

SITE_DATA.cards.forEach(function(card) {

    const element =
        document.createElement("div");

    element.className =
        "card";

    element.innerHTML = `

        <h3>
            ${card.icon} ${card.title}
        </h3>

        <p>
            ${card.description}
        </p>

    `;

    element.addEventListener(
        "click",
        function() {

            document.getElementById(
                "popupTitle"
            ).textContent =
                card.icon + " " + card.title;

            document.getElementById(
                "popupContent"
            ).innerHTML =
                card.text;

            document.getElementById(
                "popup"
            ).classList.add("active");

        }
    );

    cards.appendChild(element);

});



/* АДМИНИСТРАТОРЫ */

SITE_DATA.admins.forEach(function(admin) {

    const element =
        document.createElement("div");

    element.className =
        "card admin";

    element.innerHTML = `

        <div class="admin-name">
            ${admin.name}
        </div>

        <div class="position">
            ${admin.position}
        </div>

        <p>
            ${admin.description}
        </p>

    `;

    adminsList.appendChild(element);

});



/* ЗАКРЫТИЕ */

document.getElementById(
    "closePopup"
).onclick = function() {

    document.getElementById(
        "popup"
    ).classList.remove("active");

};



document.getElementById(
    "popup"
).onclick = function(event) {

    if (
        event.target.id === "popup"
    ) {

        event.currentTarget.classList.remove(
            "active"
        );

    }

};



/* ТЕМА */

const themeButton =
    document.getElementById(
        "themeButton"
    );


function applyTheme() {

    const theme =
        localStorage.getItem(
            "siteTheme"
        );


    if (theme === "dark") {

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀️";

    } else {

        document.body.classList.remove(
            "dark"
        );

        themeButton.textContent =
            "🌙";

    }

}


themeButton.onclick =
    function() {

        const isDark =
            document.body.classList.contains(
                "dark"
            );

        localStorage.setItem(
            "siteTheme",
            isDark
                ? "light"
                : "dark"
        );

        applyTheme();

    };


applyTheme();

</script>


</body>
</html>
