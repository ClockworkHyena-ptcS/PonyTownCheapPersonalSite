<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>@cheapponytownskins</title>

<link
    rel="stylesheet"
    href="style.css">

</head>

<body>


<button
    id="themeButton"
    type="button">

    🌙

</button>


<div class="page">


<header>

<div
    id="siteName"
    class="logo">
</div>

<div
    id="subtitle"
    class="subtitle">
</div>

</header>


<nav>

<a href="#home">
Главное
</a>

<a href="#posts">
Записи
</a>

<a href="#admins">
Администрация
</a>

</nav>


<section id="home">

<h2>
Главное ♡
</h2>

<div
    id="welcome"
    class="welcome">
</div>

</section>


<section id="posts">

<h2>
Записи 📖
</h2>

<div
    id="cards"
    class="cards">
</div>

</section>


<section id="admins">

<h2>
Администрация ♡
</h2>

<div
    id="adminsList"
    class="cards">
</div>

</section>


<footer id="footer">
</footer>


</div>


<!-- ОСНОВНОЕ ОКНО -->

<div
    id="popup"
    class="popup">

<div class="popup-window">

<div class="popup-header">

<h3
    id="popupTitle"
    class="popup-title">
</h3>

<button
    id="closePopup"
    class="close">

×

</button>

</div>


<div
    id="popupContent"
    class="popup-content">
</div>

</div>

</div>


<!-- ПАРОЛЬ -->

<div
    id="passwordPopup"
    class="popup">

<div class="popup-window">

<div class="popup-header">

<h3 class="popup-title">
♡
</h3>

<button
    id="closePassword"
    class="close">

×

</button>

</div>


<div class="password-box">

<h3>
Секретный вход
</h3>

<p>
Введите пароль владельца.
</p>

<input
    id="ownerPassword"
    type="password"
    placeholder="Пароль"
    autocomplete="off">

<br>

<button
    id="loginOwner">

Войти

</button>

<div
    id="passwordError"
    class="password-error">

Неверный пароль.

</div>

</div>

</div>

</div>


<script src="data.js"></script>


<script>

const siteName =
    document.getElementById("siteName");

const subtitle =
    document.getElementById("subtitle");

const welcome =
    document.getElementById("welcome");

const cards =
    document.getElementById("cards");

const adminsList =
    document.getElementById("adminsList");

const footer =
    document.getElementById("footer");



siteName.innerHTML =
    SITE_DATA.siteName;

subtitle.innerHTML =
    SITE_DATA.subtitle;

welcome.innerHTML =
    SITE_DATA.welcome;

footer.innerHTML =
    SITE_DATA.footer;



/* КАРТОЧКИ */

SITE_DATA.cards.forEach(function(card) {

    const element =
        document.createElement("div");

    element.className =
        "card";

    element.innerHTML = `

        <h3>
            ${card.icon} ${card.title}
        </h3>

        <p>
            ${card.description}
        </p>

    `;

    element.onclick = function() {

        openPopup(
            card.icon + " " + card.title,
            card.text
        );

    };

    cards.appendChild(element);

});



/* ВЛАДЕЛЕЦ */

const ownerCard =
    document.createElement("div");

ownerCard.className =
    "card owner-card";

ownerCard.innerHTML = `

    <h3>
        ♡ ${SITE_DATA.owner.title}
    </h3>

    <p>
        Узнать больше о владельце.
    </p>

`;

ownerCard.onclick = function() {

    openOwner();

};

adminsList.prepend(ownerCard);



/* АДМИНЫ */

SITE_DATA.admins.forEach(function(admin) {

    const element =
        document.createElement("div");

    element.className =
        "card admin";

    element.innerHTML = `

        <div class="admin-name">
            ${admin.name}
        </div>

        <div class="position">
            ${admin.position}
        </div>

        <p>
            ${admin.description}
        </p>

    `;

    adminsList.appendChild(element);

});



/* POPUP */

function openPopup(title, content) {

    document.getElementById(
        "popupTitle"
    ).textContent = title;

    document.getElementById(
        "popupContent"
    ).innerHTML = content;

    document.getElementById(
        "popup"
    ).classList.add("active");

}



/* ВЛАДЕЛЕЦ */

function openOwner() {

    const content = `

        ${SITE_DATA.owner.text}

        <button
            class="secret-heart"
            id="secretHeart">

            ${
                document.body.classList.contains("dark")
                ? "❤️"
                : "🤍"
            }

        </button>

    `;

    openPopup(
        SITE_DATA.owner.title,
        content
    );


    setTimeout(function() {

        const heart =
            document.getElementById(
                "secretHeart"
            );

        if (heart) {

            heart.onclick =
                function(event) {

                    event.stopPropagation();

                    openPassword();

                };

        }

    }, 10);

}



/* ЗАКРЫТИЕ */

document.getElementById(
    "closePopup"
).onclick = function() {

    document.getElementById(
        "popup"
    ).classList.remove("active");

};



document.getElementById(
    "popup"
).onclick = function(event) {

    if (
        event.target.id === "popup"
    ) {

        event.currentTarget
            .classList.remove("active");

    }

};



/* ПАРОЛЬ */

function openPassword() {

    document.getElementById(
        "passwordPopup"
    ).classList.add("active");

    document.getElementById(
        "ownerPassword"
    ).value = "";

    document.getElementById(
        "passwordError"
    ).style.display = "none";

}



document.getElementById(
    "closePassword"
).onclick = function() {

    document.getElementById(
        "passwordPopup"
    ).classList.remove("active");

};



/*
=================================
ПАРОЛЬ
=================================

ВАЖНО:
это не серверная защита.
Поменяй значение ниже.
*/

const OWNER_PASSWORD =
    "Clockworkhyena0909";



document.getElementById(
    "loginOwner"
).onclick = function() {

    const password =
        document.getElementById(
            "ownerPassword"
        ).value;


    if (
        password ===
        OWNER_PASSWORD
    ) {

        window.location.href =
            "admin.html";

    } else {

        document.getElementById(
            "passwordError"
        ).style.display =
            "block";

    }

};



/* ENTER */

document.getElementById(
    "ownerPassword"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            document.getElementById(
                "loginOwner"
            ).click();

        }

    }
);



/* ТЕМА */

const themeButton =
    document.getElementById(
        "themeButton"
    );


function applyTheme() {

    const theme =
        localStorage.getItem(
            "siteTheme"
        );


    if (theme === "dark") {

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀️";

    } else {

        document.body.classList.remove(
            "dark"
        );

        themeButton.textContent =
            "🌙";

    }

}


themeButton.onclick =
    function() {

        const isDark =
            document.body.classList.contains(
                "dark"
            );

        localStorage.setItem(
            "siteTheme",
            isDark
                ? "light"
                : "dark"
        );

        applyTheme();

        /*
         * Если окно владельца открыто,
         * обновляем сердечко.
         */

        const heart =
            document.getElementById(
                "secretHeart"
            );

        if (heart) {

            heart.textContent =
                isDark
                    ? "🤍"
                    : "❤️";

        }

    };


applyTheme();

</script>

</body>
    </html>
